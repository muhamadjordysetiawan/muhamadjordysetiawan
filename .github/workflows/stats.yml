name: Update Arcade Stats Card

on:
  schedule:
    # Setiap 6 jam
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/stats.svg"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/stats.py

      - name: Commit updated card
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update arcade stats card"
          file_pattern: assets/stats.svg
